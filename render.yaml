services:
  - type: web
    name: thesis-lab
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: FUYAO_API_KEY
        sync: false
      - key: TOKENHUB_API_KEY
        sync: false
      - key: TOKENHUB_BASE_URL
        value: https://tokenhub.tencentmaas.com/v1
      - key: TOKENHUB_MODEL
        value: hy3
